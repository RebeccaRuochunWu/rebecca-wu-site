<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<title>Mapier Reply Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:wght@400;500&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400&family=Playfair+Display:wght@500&display=swap">
<style>
/* Layout: mapier.ai shell. White ground, serif wordmark left, blue capsule nav centered, soft grey 28px cards, pill buttons; single light theme to match the brand site */
:root{
  --ground:#FFFFFF; --sunken:#EBEBEB; --raised:#F5F5F5; --ink:#2B2B2B; --ink-2:#5E5E5E; --ink-3:#6A6A6A; --hair:#DADADA;
  --theme:#1076C2; --theme-hover:#0D64A6; --theme-soft:#E7F1F9; --theme-deep:#0D5C96;
  --bub-gray:#E9E9EB; --bub-gray-fg:#000000; --bub-top:#56C4FF; --bub-bottom:#0B84FF;
  --good:#2E9D57; --bad:#CF372D; --bad-soft:#FDECEB; --neutral:#B4B4B4;
  --font-brand:'Playfair Display', ui-serif, Georgia, serif;
  --font-display:'Google Sans Flex','Google Sans','Inter', ui-sans-serif, system-ui, sans-serif;
  --font-body:'Inter', -apple-system, 'Segoe UI', Roboto, sans-serif;
  --font-mono:'JetBrains Mono', ui-monospace, Menlo, monospace;
  --r-card:28px; --r-inner:16px; --r-pill:9999px;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--ground); color:var(--ink); font-family:var(--font-body); font-size:15px; line-height:1.5; letter-spacing:-0.004em}
button,input,select{font:inherit; color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--theme); outline-offset:2px}
h1,h2,h3{font-family:var(--font-display); font-weight:500; margin:0; text-wrap:balance; color:var(--ink)}
h1{font-size:clamp(30px,4vw,40px); letter-spacing:-0.03em; line-height:1.1}
h2{font-size:22px; letter-spacing:-0.018em}
h3{font-size:16px; letter-spacing:-0.01em}
.num{font-family:var(--font-display); font-variant-numeric:tabular-nums; font-weight:500}
.muted{color:var(--ink-2)}
.eyebrow{font-size:12px; letter-spacing:.04em; color:var(--ink-2); font-weight:500}

/* header */
.app{min-height:100%; display:flex; flex-direction:column}
.top{display:grid; grid-template-columns:1fr auto 1fr; align-items:center; gap:16px; padding:20px clamp(20px,3.2vw,48px); position:sticky; top:env(safe-area-inset-top,0px); background:color-mix(in srgb, var(--ground) 92%, transparent); backdrop-filter:blur(8px); z-index:5}
.brand{display:flex; align-items:baseline; gap:10px}
.wordmark{font-family:var(--font-brand); font-size:30px; letter-spacing:-0.02em; color:var(--ink); line-height:1}
.product{font-size:12px; font-weight:500; color:var(--theme); background:var(--theme-soft); padding:3px 10px; border-radius:var(--r-pill)}
.nav{display:flex; gap:4px; background:var(--theme); padding:6px; border-radius:var(--r-pill); box-shadow:0 1px 2px rgba(20,18,15,.16)}
.nav button{all:unset; cursor:pointer; padding:7px 18px; border-radius:var(--r-pill); color:#fff; font-family:var(--font-display); font-weight:500; font-size:15px}
.nav button[aria-current="page"]{background:#fff; color:var(--theme)}
.nav button:focus-visible{outline:2px solid #fff; outline-offset:1px}
.acct{justify-self:end; display:flex; align-items:center; gap:12px; font-family:var(--font-display); font-weight:500; color:var(--theme-deep)}
.avatar{width:36px; height:36px; border-radius:50%; background:var(--theme); color:#fff; display:grid; place-items:center; font-size:13px}

.main{padding-block:24px 80px; padding-inline:clamp(20px,3.2vw,48px); min-width:0; flex:1}
.view{max-width:1120px; margin:0 auto; display:flex; flex-direction:column; gap:24px}
.row{display:flex; gap:12px; align-items:center; flex-wrap:wrap}
.spread{justify-content:space-between}

.btn{border:0; background:var(--sunken); color:var(--ink); padding:9px 18px; border-radius:var(--r-pill); font-family:var(--font-display); font-weight:500; font-size:15px}
.btn:hover{background:#E0E0E0}
.btn.primary{background:var(--theme); color:#fff}
.btn.primary:hover{background:var(--theme-hover)}
.btn[disabled]{opacity:.4; cursor:not-allowed}
.btn.ghost{background:transparent; color:var(--theme-deep); padding-inline:0}
.btn.ghost:hover{text-decoration:underline}

.panel{background:var(--sunken); border-radius:var(--r-card); padding:28px}
.pill{display:inline-flex; align-items:center; gap:6px; padding:3px 11px; border-radius:var(--r-pill); font-size:12px; font-weight:500; background:var(--sunken); color:var(--ink-2)}
.pill::before{content:""; width:6px; height:6px; border-radius:50%; background:currentColor}
.pill.live{color:var(--good); background:#E5F4EA}
.pill.done{color:var(--theme); background:var(--theme-soft)}

/* surveys table */
.tablewrap{overflow-x:auto}
table{width:100%; border-collapse:collapse}
th{text-align:left; font-size:12px; color:var(--ink-2); font-weight:500; padding:10px 14px; border-bottom:1px solid var(--hair)}
td{padding:16px 14px; border-bottom:1px solid var(--hair); white-space:nowrap}
tbody tr:last-child td{border-bottom:0}
tbody tr{cursor:pointer}
tbody tr:hover td{background:var(--raised)}
td .name{font-weight:500}

/* templates */
.tpl-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:16px}
.tpl{all:unset; cursor:pointer; border-radius:24px; padding:22px; background:var(--sunken); display:grid; gap:6px; transition:background .15s}
.tpl:hover{background:var(--theme-soft)}
.tpl:focus-visible{outline:2px solid var(--theme)}
.tpl b{font-family:var(--font-display); font-weight:500; font-size:18px}

/* stepper */
.stepper{display:flex; gap:4px; flex-wrap:wrap; background:var(--sunken); padding:5px; border-radius:var(--r-pill)}
.step{all:unset; display:flex; align-items:center; gap:8px; padding:6px 14px 6px 6px; border-radius:var(--r-pill); color:var(--ink-2); font-family:var(--font-display); font-weight:500; font-size:14px; cursor:default}
.step .dot{width:22px; height:22px; border-radius:50%; display:grid; place-items:center; font-size:12px; background:#fff; color:var(--ink-2)}
.step.on{color:var(--ink); background:#fff; box-shadow:0 1px 2px rgba(20,18,15,.12)}
.step.on .dot{background:var(--theme); color:#fff}
.step.done{cursor:pointer; color:var(--ink)}
.step.done .dot{background:var(--theme-soft); color:var(--theme)}

/* builder */
.split{display:grid; grid-template-columns:minmax(0,1fr) 340px; gap:28px; align-items:start}
.qcard{border-radius:24px; background:var(--sunken); padding:20px; display:grid; gap:12px}
.qhead{display:flex; gap:10px; align-items:center}
.qtag{font-family:var(--font-display); font-weight:500; font-size:13px; padding:3px 10px; border-radius:var(--r-pill); background:var(--theme); color:#fff}
input[type=text],input[type=number],select{border:1px solid transparent; background:#fff; border-radius:12px; padding:10px 12px; width:100%; min-width:0}
input[type=text]:hover,input[type=number]:hover,select:hover{border-color:var(--hair)}
select{width:auto; border-radius:var(--r-pill); padding-inline:14px}
.opt{display:flex; gap:8px; align-items:center}
.opt .key{font-family:var(--font-mono); font-size:12px; color:var(--ink-3); width:20px}
.iconbtn{all:unset; cursor:pointer; color:var(--ink-3); padding:4px 8px; border-radius:var(--r-pill); line-height:1; font-size:13px}
.iconbtn:hover{color:var(--bad); background:var(--bad-soft)}
.iconbtn[disabled]{opacity:.35; pointer-events:none}
.iconbtn:focus-visible{outline:2px solid var(--theme)}
.hint{font-size:13px; color:var(--ink-2)}
.warn-text{color:var(--bad); font-size:14px}

/* phone */
.phone{position:sticky; top:110px; border-radius:44px; padding:10px; background:#1D1B20; box-shadow:0 32px 64px -12px rgba(8,22,42,.35), 0 12px 28px -6px rgba(8,22,42,.25)}
.screen{border-radius:34px; background:#fff; height:580px; overflow-y:auto; padding:18px 12px; display:flex; flex-direction:column; gap:6px}
.screen .who{text-align:center; font-size:12px; color:var(--ink-2); margin-bottom:8px}
.screen .who b{display:block; color:var(--ink); font-size:13px; font-weight:600}
.bub{max-width:80%; padding:7px 12px; border-radius:18px; font-size:13.5px; line-height:1.35; white-space:pre-line; overflow-wrap:anywhere; font-family:-apple-system, 'SF Pro Text', var(--font-body)}
.bub.in{background:var(--bub-gray); color:var(--bub-gray-fg); align-self:flex-start; border-bottom-left-radius:6px}
.bub.out{background:linear-gradient(180deg,var(--bub-top) -60%,var(--bub-bottom) 100%); color:#fff; align-self:flex-end; border-bottom-right-radius:6px}
.phone-cap{text-align:center; font-size:13px; color:var(--ink-2); margin-top:12px}

/* audience */
.fields{display:grid; gap:24px}
.field{display:grid; gap:8px}
.chips{display:flex; gap:8px; flex-wrap:wrap}
.chip{border:0; background:#fff; padding:7px 15px; border-radius:var(--r-pill); font-family:var(--font-display); font-weight:500}
.chip[aria-pressed="true"]{background:var(--theme); color:#fff}
.stat{display:grid; gap:2px}
.stat .num{font-size:32px; letter-spacing:-0.02em}
.switch{display:flex; align-items:flex-start; gap:10px}
.switch input{width:18px; height:18px; accent-color:var(--theme); margin-top:2px}
.checks{display:grid; gap:6px}
.checks label{display:flex; gap:8px; align-items:center}
.checks input{accent-color:var(--theme)}

/* checkout */
.lines{display:grid; gap:12px}
.line{display:flex; justify-content:space-between; gap:12px}
.line.total{border-top:1px solid var(--hair); padding-top:14px; font-weight:500; font-size:18px; font-family:var(--font-display)}
.stepperinput{display:flex; align-items:center; gap:8px}
.stepperinput input{width:110px; text-align:center}
.card-mock{display:flex; justify-content:space-between; align-items:center; border-radius:var(--r-inner); padding:14px 16px; background:#fff}

/* review overlay */
.overlay{position:fixed; inset:0; background:rgba(29,27,32,.35); backdrop-filter:blur(4px); display:grid; place-items:center; padding:16px; z-index:10}
.overlay .panel{background:#fff; width:min(440px,100%); display:grid; gap:16px; box-shadow:0 32px 64px -12px rgba(8,22,42,.4)}
.check-row{display:flex; gap:10px; align-items:center}
.tick{width:22px; height:22px; border-radius:50%; display:grid; place-items:center; font-size:12px; background:var(--sunken); flex:none}
.tick.ok{background:var(--theme); color:#fff}
.tick.run{background:transparent; border:2px solid var(--theme); border-top-color:transparent; animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){.tick.run{animation:none}}

/* results */
.progress{height:8px; border-radius:var(--r-pill); background:#fff; overflow:hidden}
.progress > i{display:block; height:100%; background:var(--theme); border-radius:var(--r-pill); transition:width .6s ease}
@media (prefers-reduced-motion: reduce){.progress > i{transition:none}}
.ai{background:var(--theme); color:#fff; border-radius:var(--r-card); padding:28px; display:grid; gap:12px}
.ai h2{color:#fff}
.ai ul{margin:0; padding-left:20px; display:grid; gap:8px; font-size:16px}
.ai .hint, .ai .muted{color:rgba(255,255,255,.8)}
.badge{font-size:11px; padding:3px 10px; border-radius:var(--r-pill); background:var(--theme-soft); color:var(--theme); font-weight:600}
.ai .badge{background:rgba(255,255,255,.18); color:#fff}
.qnav{display:flex; gap:4px; flex-wrap:wrap; background:#fff; padding:4px; border-radius:var(--r-pill)}
.qnav button{border:0; background:transparent; border-radius:var(--r-pill); padding:5px 12px; font-family:var(--font-display); font-weight:500; font-size:13px; color:var(--ink-2)}
.qnav button[aria-current="true"]{background:var(--theme); color:#fff}
.qbody{display:grid; grid-template-columns:300px minmax(0,1fr); gap:28px; align-items:start}
.insight{background:#fff; border-radius:var(--r-inner); padding:18px 20px; display:grid; gap:8px}
.bars{display:grid; gap:14px}
.bar-row{display:grid; gap:5px}
.bar-row .lab{display:flex; justify-content:space-between; gap:12px; font-size:14px}
.bar-track{height:14px; background:#fff; border-radius:var(--r-pill); overflow:hidden; display:flex}
.bar-track i{display:block; height:100%; transition:width .6s ease}
@media (prefers-reduced-motion: reduce){.bar-track i{transition:none}}
.legend{display:flex; gap:14px; flex-wrap:wrap; font-size:13px; color:var(--ink-2)}
.legend span{display:flex; align-items:center; gap:6px}
.legend i{width:9px; height:9px; border-radius:50%; display:inline-block}
.quote{font-size:14px; border-left:2px solid var(--hair); padding-left:10px; color:var(--ink-2)}
.bignum{font-family:var(--font-display); font-size:44px; font-weight:500; letter-spacing:-0.03em; line-height:1}
.empty-note{padding:20px; background:#fff; border-radius:var(--r-inner); color:var(--ink-2)}

.toast{position:fixed; left:50%; bottom:calc(24px + env(safe-area-inset-bottom, 0px)); transform:translateX(-50%); background:#1D1B20; color:#fff; padding:11px 18px; border-radius:var(--r-pill); font-size:14px; z-index:20}
.proto{font-size:11px; color:var(--theme); background:var(--theme-soft); border-radius:var(--r-pill); padding:2px 9px; font-weight:500}

@media (max-width: 960px){
  .split{grid-template-columns:minmax(0,1fr)}
  .phone{position:static; max-width:340px; margin:0 auto; width:100%}
  .qbody{grid-template-columns:minmax(0,1fr)}
}
@media (max-width: 760px){
  .top{grid-template-columns:1fr auto; row-gap:12px}
  .nav{grid-column:1 / -1; grid-row:2; justify-self:start}
  .acct span:first-child{display:none}
  .panel{padding:20px; border-radius:22px}
}

/* v3 additions: builder panel, billing */
.view > .row select, .field > input[type=text]#survey-name{background:var(--sunken)}
.balance-pill{all:unset; cursor:pointer; font-family:var(--font-display); font-weight:500; font-size:14px; color:var(--theme-deep); background:var(--theme-soft); padding:6px 14px; border-radius:var(--r-pill)}
.balance-pill:hover{background:#D9E9F5}
.balance-pill:focus-visible{outline:2px solid var(--theme)}
.builder{display:grid; grid-template-columns:290px minmax(0,1fr) 300px; gap:24px; align-items:start}
.addpanel{position:sticky; top:110px; background:var(--sunken); border-radius:24px; padding:16px; display:grid; gap:14px}
.tabs{display:flex; gap:4px; background:#fff; padding:4px; border-radius:var(--r-pill)}
.tabs button{flex:1; border:0; background:transparent; border-radius:var(--r-pill); padding:7px 6px; font-family:var(--font-display); font-weight:500; font-size:13px; color:var(--ink-2); white-space:nowrap}
.tabs button[aria-selected="true"]{background:var(--theme); color:#fff}
.elems{display:grid; gap:8px; max-height:520px; overflow-y:auto}
.elem{background:#fff; border-radius:var(--r-inner); padding:12px 14px; display:grid; gap:4px}
.elem .row{gap:8px}
.elem b{font-weight:500; flex:1}
.elem .tip{font-size:12px; color:var(--theme-deep)}
.mini{border:0; background:var(--theme-soft); color:var(--theme); border-radius:var(--r-pill); padding:4px 12px; font-family:var(--font-display); font-weight:500; font-size:13px}
.mini:hover{background:#D9E9F5}
.mini[disabled]{opacity:.4; cursor:not-allowed}
textarea{border:1px solid transparent; background:#fff; border-radius:12px; padding:10px 12px; width:100%; min-height:130px; resize:vertical; font:inherit; color:inherit}
textarea:hover{border-color:var(--hair)}
.parsed{display:grid; gap:6px}
.parsed .p{background:#fff; border-radius:12px; padding:8px 12px; display:flex; gap:8px; align-items:baseline; font-size:14px}
.parsed .p.over{opacity:.45}
.typetag{font-size:11px; padding:2px 8px; border-radius:var(--r-pill); background:var(--sunken); color:var(--ink-2); white-space:nowrap}
.suggest{display:flex; flex-wrap:wrap; gap:6px}
.suggest button{border:0; background:#fff; border-radius:var(--r-pill); padding:5px 11px; font-size:12.5px; color:var(--ink-2)}
.suggest button:hover{color:var(--ink)}
.radio{display:flex; gap:14px; font-size:14px}
.radio label{display:flex; gap:6px; align-items:center}
.radio input{accent-color:var(--theme)}
.canvas-empty{border:2px dashed var(--hair); border-radius:24px; padding:40px 24px; text-align:center; color:var(--ink-2)}
.aitag{font-size:11px; padding:2px 8px; border-radius:var(--r-pill); background:var(--theme-soft); color:var(--theme); font-weight:600}
.statgrid{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:16px}
.statcard{background:var(--sunken); border-radius:24px; padding:22px; display:grid; gap:4px}
.statcard .num{font-size:30px; letter-spacing:-0.02em}
.amt-pos{color:var(--good)}
.amt-neg{color:var(--ink)}
.topup{display:grid; gap:12px; background:#fff; border-radius:var(--r-inner); padding:16px}
.notice{background:var(--theme-soft); color:var(--theme-deep); border-radius:var(--r-inner); padding:12px 14px; font-size:14px}
.reported{color:var(--ink-3); font-size:13px}
@media (max-width: 1180px){ .builder{grid-template-columns:270px minmax(0,1fr)} .builder > .phonecol{grid-column:1 / -1} .phone{position:static; max-width:340px; margin:0 auto} }
@media (max-width: 760px){ .builder{grid-template-columns:minmax(0,1fr)} .addpanel{position:static} .statgrid{grid-template-columns:minmax(0,1fr)} .balance-pill{display:none} }
.settings{display:grid; grid-template-columns:200px minmax(0,1fr); gap:28px; align-items:start}
.setnav{position:sticky; top:110px; display:grid; gap:2px}
.setnav button{all:unset; cursor:pointer; padding:8px 14px; border-radius:var(--r-pill); color:var(--ink-2); font-family:var(--font-display); font-weight:500}
.setnav button:hover{background:var(--sunken); color:var(--ink)}
.setnav button:focus-visible{outline:2px solid var(--theme)}
@media (max-width: 760px){ .settings{grid-template-columns:minmax(0,1fr)} .setnav{position:static; display:flex; flex-wrap:wrap} }
.card-mock{flex-wrap:wrap; gap:8px}
.smart-result{display:grid; gap:10px}
.fchip{background:#fff; border-radius:var(--r-pill); padding:6px 12px; font-size:13.5px}
.fchip b{font-weight:500}
.smartbox{background:linear-gradient(180deg, var(--theme-soft), var(--sunken))}
</style>
</head>
<body>

<div class="app">
  <header class="top">
    <div class="brand"><span class="wordmark">mapier</span><span class="product">Reply</span></div>
    <nav class="nav" aria-label="Main">
      <button id="nav-surveys" aria-current="page">Surveys</button>
      <button id="nav-billing">Billing</button>
      <button id="nav-settings">Settings</button>
    </nav>
    <div class="acct"><button class="balance-pill" id="bal-pill"></button><span class="avatar" aria-label="Priya Shah, Acme Snacks">PS</span></div>
  </header>
  <main class="main" id="main"></main>
</div>
<div id="overlay-root"></div>
<div class="toast" id="toast" hidden></div>

<script>
(function(){
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt$ = n => (n<0?'−':'') + '$' + Math.abs(n).toLocaleString('en-US',{minimumFractionDigits:2, maximumFractionDigits:2});
const fmtN = n => n.toLocaleString('en-US');
const clone = o => JSON.parse(JSON.stringify(o));
function hash(s){let h=2166136261; for(const c of s){h^=c.charCodeAt(0); h=Math.imul(h,16777619);} return (h>>>0);}

/* ---------- billing model (placeholders, see PRD Billing & pricing) ---------- */
const FEE = 0.40, SCREEN_PAY = 0.25, MIN_TOPUP = 50;
const minReward = qs => 1.00 + 0.25*Math.max(0, qs.length-3);
const wallet = {available:187.00, reserved:287.70, spentMonth:475.30,
  methods:[{id:'v',brand:'Visa',last4:'4242',exp:'08/28',main:true},{id:'m',brand:'Mastercard',last4:'5100',exp:'10/26',backup:true,expSoon:true}],
  autoTopup:{on:false, below:50, amt:200},
  details:{address:'Acme Snacks Inc., 500 Howard St, San Francisco, CA 94105', tax:'', email:'billing@acmesnacks.com'}};
const settings = {name:'Priya Shah', email:'priya@acmesnacks.com', signin:'google',
  notify:{launched:true, filled:true, slow:true, lowbal:true, weekly:false},
  defaults:{rewardBump:0, capPct:0.5, reminder:'1h', runDays:7}, sender:'mapier', retention:'365',
  get(p){ return p.split('.').reduce((o,k)=>o[k], this); },
  set(p,v){ const ks=p.split('.'); let o=this; ks.slice(0,-1).forEach(k=>o=o[k]); o[ks[ks.length-1]]=v; }};
function senderName(){ return settings.sender==='branded'?'Mapier Research for Acme Snacks':'Mapier Research'; }
function mainCard(){ const m=wallet.methods.find(x=>x.main); return m.brand+(m.last4?' ending '+m.last4:''); }
const txns = [
  {date:'Oct 8', desc:'Reserved for launch', survey:'Spicy mango chip concept', amt:-472.50},

function parseImport(txt){
  const out=[]; const blocks=txt.split(/\n\s*\n/).map(b=>b.trim()).filter(Boolean);
  const lines = blocks.length>1?blocks:txt.split('\n').map(l=>l.trim()).filter(Boolean).reduce((acc,l)=>{ if(/^([-*•]|\d+[).]|[A-Fa-f][).])\s+/.test(l) && acc.length) acc[acc.length-1]+='\n'+l; else acc.push(l); return acc;},[]);
  lines.forEach(b=>{ const ls=b.split('\n').map(x=>x.trim()).filter(Boolean); const text=ls[0].replace(/^(Q?\d+[).:]\s*)/i,'');
    const opts=ls.slice(1).map(x=>x.replace(/^([-*•]|\d+[).]|[A-Fa-f][).])\s*/,'')).filter(Boolean);
    let type='text';
    if(opts.length>=2) type=/all that apply|select all/i.test(text)?'multi':'single';
    else if(/recommend|0\s*(–|-|to)\s*10/i.test(text)) type='nps';
    else if(/1\s*(–|-|to)\s*5|rate/i.test(text)) type='rating';
    else if(/how (many|much)|zip|\$/i.test(text)) type='number';
    else if(/^(do|did|are|is|have|has|would|will|can)\b/i.test(text)) type='yesno';
    const q={type,text:text.slice(0,120)}; if(type==='single'||type==='multi') q.options=opts.slice(0,MAXOPT).map(o=>o.slice(0,40));
    out.push(q); });
  return out;
}
function parseCSV(txt){
  const rows=txt.split(/\r?\n/).filter(r=>r.trim()); if(!rows.length) return [];
  const cells=r=>{const o=[];let cur='',q=false;for(const ch of r){if(ch==='"'){q=!q;continue;} if(ch===','&&!q){o.push(cur);cur='';} else cur+=ch;} o.push(cur); return o.map(x=>x.trim());};
  let start=0; const h=cells(rows[0]).map(x=>x.toLowerCase()); if(h[0]==='question') start=1;
  return rows.slice(start).map(r=>{const [text,type,opts]=cells(r); const t=Object.keys(TYPES).includes((type||'').toLowerCase())?type.toLowerCase():(opts?'single':'text');
    const q={type:t,text:(text||'').slice(0,120)}; if(t==='single'||t==='multi') q.options=(opts||'').split('|').map(o=>o.trim().slice(0,40)).filter(Boolean).slice(0,MAXOPT); return q;}).filter(q=>q.text);
}

function promptFor(q,i,total){

  if(q.type==='multi') t+='\n'+q.options.map((o,j)=>`${j+1}) ${o||'…'}`).join('\n')+'\nReply with all that apply, like 1,3';
  if(q.type==='rating') t+='\nReply 1 (not at all) to 5 (very)';
  if(q.type==='nps') t+='\nReply 0 (not likely) to 10 (very likely)';
  if(q.type==='yesno') t+='\nReply YES or NO';
  if(q.type==='number') t+='\nReply with a number';
  return t;
}

function smartParse(text){
  const t=' '+text.toLowerCase()+' '; const r={ages:null, gender:null, region:null, income:null, employment:null, kids:null, shopping:null, reasons:[], screener:null, refused:[]};
  const why=(label,val,src)=>r.reasons.push({label,val,src});
  const m=(re)=>{const x=t.match(re); return x?x[0].trim():null;};
  let s;
  if(s=m(/\bgen ?z\b|\bcollege\b|\bteens?\b/)){ r.ages=['18–24']; }
  else if(s=m(/\bmillennials?\b/)){ r.ages=['25–34','35–44']; }
  else if(s=m(/\bgen ?x\b/)){ r.ages=['45–54']; }
  else if(s=m(/\bboomers?\b|\bseniors?\b|\bretirees?\b|over 55|55\+/)){ r.ages=['55+']; }
  else if(s=m(/\bin their (20|30|40|50)s\b/)){ const d=s.match(/\d+/)[0]; r.ages={20:['18–24','25–34'],30:['25–34','35–44'],40:['35–44','45–54'],50:['45–54','55+']}[d]; }
  else if(s=m(/\byoung adults?\b/)){ r.ages=['18–24','25–34']; }
  if(r.ages) why('Age', r.ages.join(', '), s);
  if(s=m(/\b(women|woman|female|females|moms?|mothers?|ladies)\b/)){ r.gender='Women'; why('Gender','Women',s); }
  else if(s=m(/\b(men|man|male|males|dads?|fathers?|guys)\b/)){ r.gender='Men'; why('Gender','Men',s); }
  if(s=m(/\b(moms?|mothers?|dads?|fathers?|parents?|with kids|have kids)\b/)){ r.kids='Yes'; why('Kids at home','Yes',s); }
  for(const [reg,list] of Object.entries(STATES)){ const hit=list.find(w=>t.includes(' '+w)); if(hit){ r.region=reg; why('Region',reg,hit); break; } }
  if(s=m(/high[- ]income|affluent|wealthy|high earners|\$100k/)){ r.income=['$100k–$149k','$150k or more']; why('Household income','$100k or more',s); }
  else if(s=m(/low[- ]income|budget[- ]conscious|on a budget/)){ r.income=['Under $50k']; why('Household income','Under $50k',s); }
  if(s=m(/\bprofessionals?\b|\bfull[- ]time\b|office workers?/)){ r.employment=['Full-time']; why('Employment','Full-time',s); }
  else if(s=m(/\bstudents?\b/)){ r.employment=['Student']; why('Employment','Student',s); }
  else if(s=m(/freelancers?|self[- ]employed|small business owners?/)){ r.employment=['Self-employed']; why('Employment','Self-employed',s); }
  if(s=m(/shop(s|ping)? online (every week|weekly|often|a lot)|online shoppers?|order(s)? groceries online/)){ r.shopping='Weekly or more'; why('Online shopping','Weekly or more',s); }
  const sens=t.match(/\b(diabet\w*|cancer|depress\w*|anxiety|pregnan\w*|religio\w*|christians?|muslims?|jewish|hindus?|black|asian|hispanic|latin[oax]s?|gay|lesbian|lgbtq?\+?|democrats?|republicans?|liberals?|conservatives?|disabilit\w*|disabled)\b/g);

  let pet=t.match(/\b(dog|cat|pet)[- ]owners?\b|\bwho (?:have|own) an? (dog|cat|pet)s?\b/);
  if(pet){ const a=pet[1]||pet[2]; r.screener={type:'yesno', text:`Do you have a ${a}?`, keep:[0], screener:true, src:pet[0]}; }
  else { const v=t.match(/\b(?:who|and|that) (drink|drinks|use|uses|buy|buys|eat|eats|play|plays|watch|watches|drive|drives|own|owns) ([a-z' ]+?)(?= (?:and|in|on|at|from|who|every|weekly)\b| $)/);
    if(v){ const verb=v[1].replace(/s$/,'').replace(/ie$/,'y'); r.screener={type:'yesno', text:`Do you ${verb} ${v[2].trim()}?`, keep:[0], screener:true, src:v[0].trim()}; } }
  return r;
}
function applySmart(d,r){

  if(r.income) a.income=r.income.slice(); if(r.employment) a.employment=r.employment.slice(); if(r.kids) a.kids=r.kids; if(r.shopping) a.shopping=r.shopping;

function audienceCalc(d){
  const a=d.aud; const share=(sel,all,sh)=>sel&&sel.length?sel.reduce((s,x)=>s+sh[all.indexOf(x)],0):1;
  let f=share(a.ages,AGES,AGE_SHARE)*(a.gender==='Everyone'?1:0.5)*REGIONS[a.region]*share(a.income,INCOMES,INCOME_SHARE)*share(a.employment,EMPLOY,EMPLOY_SHARE);
  if(a.kids!=='Any') f*= a.kids==='Yes'?0.35:0.65; if(a.shopping!=='Any') f*=SHOP_SHARE[SHOP.indexOf(a.shopping)]; if(a.excludePast) f*=0.92;

  const boost=Math.sqrt((d.reward||minReward(d.qs))/minReward(d.qs));

function pricing(d){

  const reserve=+(d.n*per + cap*screenPer).toFixed(2);
  const short=Math.max(0, reserve-wallet.available); const topup=short>0?Math.max(MIN_TOPUP, Math.ceil(short*100)/100):0;
  return {reward, fee, per, cap, screenPer, reserve, short, topup};
}

function weightsFor(q, salt){
  if(q.w) return q.w;

  const raw=Array.from({length:n},(_,i)=>0.4+((hash(q.text+i+salt)%1000)/1000)*1.6);
  if(q.type==='nps'){ for(let i=0;i<11;i++) raw[i]*= i>=9?3.2:i>=7?2.2:0.6; }
  const s=raw.reduce((a,b)=>a+b,0); return raw.map(x=>x/s);
}
function countsFrom(w, n){ const c=w.map(x=>Math.floor(x*n)); let r=n-c.reduce((a,b)=>a+b,0); const order=w.map((x,i)=>[x*n-Math.floor(x*n),i]).sort((a,b)=>b[0]-a[0]); for(let i=0;i<r;i++) c[order[i%order.length][1]]++; return c; }

function salt(){ const f=state.filter; return f.age+f.gender+f.region; }
const GENERIC_TOPICS=[['Taste and quality',42,8,6],['Price and value',18,10,22],['Convenience',30,6,4],['Trust in the brand',14,9,7]];
function labelsFor(q){ return q.type==='single'||q.type==='multi'?q.options:q.type==='rating'?['1','2','3','4','5']:q.type==='yesno'?['Yes','No']:q.type==='nps'?Array.from({length:11},(_,i)=>String(i)):[]; }
function qPanel(s,q,i,n){

      return `<div class="bar-row"><div class="lab"><span>${esc(name)}</span><span class="num">${tot}</span></div>
      <div class="bar-track" style="background:transparent"><i style="width:${W(p)};background:var(--good)"></i><i style="width:${W(u)};background:var(--neutral)"></i><i style="width:${W(g)};background:var(--bad)"></i></div></div>`;}).join('');
    const top=topics.slice().sort((a,b)=>(b[1]+b[2]+b[3])-(a[1]+a[2]+a[3]))[0];
    return `<div class="qbody"><div class="insight"><span class="row" style="gap:8px"><b>Top insight</b><span class="badge">AI</span></span>

      <div style="display:grid;gap:14px;min-width:0"><div class="legend"><span><i style="background:var(--good)"></i>Positive</span><span><i style="background:var(--neutral)"></i>Neutral</span><span><i style="background:var(--bad)"></i>Negative</span></div><div class="bars">${bars}</div>
      <span class="hint">Themes and sentiment grouped by AI from ${fmtN(n)} answers.</span></div></div>`;
  }
  if(q.type==='number'){
    const med=12+(hash(q.text)%8); return `<div class="qbody"><div class="insight"><span class="row" style="gap:8px"><b>Top insight</b><span class="badge">AI</span></span><span>Most answers fall between ${med-4} and ${med+5}.</span></div>
      <div style="display:grid;gap:6px"><span class="eyebrow">Median answer</span><span class="bignum">${med}</span><span class="hint">Middle 50%: ${med-4}–${med+5} · ${fmtN(n)} answers</span></div></div>`;
  }
  const w=weightsFor(q, salt()); const c=countsFrom(w,n); const labs=labelsFor(q);
  let extra='';
  if(q.type==='nps'){ const pro=c.slice(9).reduce((a,b)=>a+b,0), det=c.slice(0,7).reduce((a,b)=>a+b,0); const score=Math.round((pro-det)/n*100);
    extra=`<div style="display:grid;gap:4px;margin-bottom:10px"><span class="eyebrow">NPS</span><span class="bignum">${score>0?'+':''}${score}</span><span class="hint">${Math.round(pro/n*100)}% promoters · ${Math.round(det/n*100)}% detractors</span></div>`; }
  if(q.type==='rating'){ const avg=c.reduce((a,v,j)=>a+v*(j+1),0)/n; extra=`<div style="display:grid;gap:4px;margin-bottom:10px"><span class="eyebrow">Average</span><span class="bignum">${avg.toFixed(1)}<span class="muted" style="font-size:18px"> / 5</span></span></div>`; }
  const order=labs.map((l,j)=>j); if(q.type==='single'||q.type==='multi') order.sort((a,b)=>c[b]-c[a]);
  const max=Math.max(...c);
  const bars=order.map(j=>`<div class="bar-row"><div class="lab"><span>${esc(labs[j])}</span><span class="num">${c[j]} · ${Math.round(c[j]/n*100)}%</span></div>
    <div class="bar-track"><i style="width:${(c[j]/max*100).toFixed(1)}%;background:var(--theme);opacity:${c[j]===max?1:0.5}"></i></div></div>`).join('');
  const topJ=c.indexOf(max);
  return `<div class="qbody"><div class="insight"><span class="row" style="gap:8px"><b>Top insight</b><span class="badge">AI</span></span><span>${esc(insight||`“${labs[topJ]}” leads with ${Math.round(max/n*100)}% of ${fmtN(n)} answers.`)}</span></div>
    <div style="min-width:0">${extra}<div class="bars">${bars}</div></div></div>`;
}
function summaryFor(s){
  const f=state.filter; if(s.summary && s.status==='done' && f.age==='All ages' && f.gender==='Everyone' && f.region==='All US') return s.summary;
  const n=Math.max(filteredN(s),1); const out=[];
  s.qs.forEach((q,i)=>{ if(out.length>=3) return; if(['single','yesno','rating'].includes(q.type)){ const c=countsFrom(weightsFor(q,salt()),n); const labs=labelsFor(q); const m=c.indexOf(Math.max(...c));
      out.push(q.type==='rating'?`Q${i+1}: average rating is ${(c.reduce((a,v,j)=>a+v*(j+1),0)/n).toFixed(1)} out of 5`:`Q${i+1}: ${Math.round(c[m]/n*100)}% chose “${labs[m]}”`);}
    if(q.type==='text'){ const t=(q.topics||GENERIC_TOPICS)[0]; out.push(`Q${i+1}: the most common theme is “${t[0]}”`);} });
  return out;
}
function recentResponses(s){
  const rows=[]; const k=Math.min(5,s.got);
  for(let r=0;r<k;r++){ const idx=s.got-r; const parts=s.qs.slice(0,3).map((q,i)=>{const labs=labelsFor(q); if(labs.length){const w=weightsFor(q,'r'+idx); const pick=hash(String(idx)+i)%1000/1000; let acc=0; let j=0; for(;j<w.length;j++){acc+=w[j]; if(pick<acc) break;} return labs[Math.min(j,labs.length-1)];}
      if(q.type==='number') return String(10+hash(String(idx))%15); const a=q.answers||['tastes great','too pricey','would try it','not for me','love the flavor']; return a[hash(String(idx)+i)%a.length];});
    rows.push({id:`${s.id}-${idx}`, num:idx, ago: r===0?'just now':`${r*4} min ago`, text:parts.join(' · ')}); }
  return rows;
}

function openResults(id){
  state.resultsId=id; state.qi=0; state.filter={age:'All ages',gender:'Everyone',region:'All US'}; go('results');
  const s=surveys.find(x=>x.id===id);
  if(s.status==='live'){ clearInterval(ticker); ticker=setInterval(()=>{ const before=s.got; s.got=Math.min(s.n, s.got+3+Math.floor(Math.random()*7));
      const per=s.reward*(1+FEE); const cost=(s.got-before)*per; wallet.reserved-=cost; wallet.spentMonth+=cost;
      if(s.got>=s.n){ s.status='done'; s.fillTime='1 h 40 min'; clearInterval(ticker); ticker=null;
        const used=Math.round(s.cap*0.3); const sp=used*SCREEN_PAY*(1+FEE); const release=Math.max(0,+(s.reserve - s.n*per - sp).toFixed(2));
        wallet.reserved=Math.max(0,wallet.reserved-sp-release); wallet.spentMonth+=sp; wallet.available+=release;
        if(release>0) txns.unshift({date:'Today', desc:'Released: unused screen-out slots', survey:s.name, amt:release});
        toast(release>0?`All responses are in · ${fmt$(release)} returned to your balance`:'All responses are in'); }
      updatePill(); if(state.view==='results' && state.resultsId===id){ const y=window.scrollY; render(); window.scrollTo(0,y);} },1200); }
}

function newDraft(t){ state.smart={text:'',busy:false,result:null}; state.moreOpen=false; return {name:t?t.name:'Untitled survey', qs:t?clone(t.qs):[], n:200, reward:null, capPct:settings.defaults.capPct, screener:null, aud:{ages:[], gender:'Everyone', region:'All US', income:[], employment:[], kids:'Any', shopping:'Any', excludePast:false}}; }

document.addEventListener('click', e=>{
  const t=e.target.closest('button, tr[data-id]'); if(!t) return;
  if(t.matches('tr[data-id]')){ const s=surveys.find(x=>x.id===t.dataset.id);
    if(s.status==='draft'){ state.draft=newDraft({name:s.name, qs:s.qs}); state.draft.aud.ages=[]; state.step=1; state.tab='elements'; go('build'); } else openResults(s.id); return; }
  const id=t.id; const d=state.draft;
  if(id==='nav-surveys'||id==='back-home') return go('home');
  if(id==='nav-billing'||id==='bal-pill') return go('billing');
  if(id==='nav-settings'){ state.confirmDelete=false; return go('settings'); }
  if(id==='new-survey') return go('templates');
  if(t.dataset.tpl){ state.draft=newDraft(t.dataset.tpl==='blank'?null:TEMPLATES.find(x=>x.id===t.dataset.tpl)); state.step=1; state.tab=t.dataset.tpl==='blank'?'ai':'elements'; state.parsed=null; state.importText=''; state.aiGoal=''; return go('build'); }
  if(t.dataset.step && t.classList.contains('done')){ state.step=+t.dataset.step; return render(); }
  if(t.dataset.tab){ state.tab=t.dataset.tab; return render(); }
  if(t.dataset.elem){ const el=ELEMENTS.find(x=>x.id===t.dataset.elem); addQuestions([el.q],'add'); toast(`Added “${el.label}”`); return render(); }
  if(id==='imp-parse'){ state.parsed=parseImport(state.importText); return render(); }
  if(id==='imp-add'){ const r=addQuestions(state.parsed,'add'); state.parsed=null; state.importText=''; toast(`Added ${r.added} question${r.added===1?'':'s'}${r.skipped?` · ${r.skipped} over the limit left out`:''}`); return render(); }
  if(t.dataset.suggest){ state.aiGoal=t.dataset.suggest; return render(); }
  if(id==='ai-go'){ state.aiBusy=true; render(); setTimeout(()=>{ const dr=aiDraft(state.aiGoal); const r=addQuestions(dr.qs,state.aiMode); if(state.aiMode==='replace'||d.name==='Untitled survey') d.name=dr.name;
      state.aiBusy=false; toast(`Drafted ${r.added} questions`); render(); },1100); return; }
  if(t.dataset.regen){ const q=d.qs[+t.dataset.regen]; const alts=AI_ALTS[q.type]||[q.text]; q.text=alts[(alts.indexOf(q.text)+1)%alts.length]; return render(); }
  if(t.dataset.addopt){ d.qs[+t.dataset.addopt].options.push(''); return render(); }
  if(t.dataset.delopt){ const [i,j]=t.dataset.delopt.split(':').map(Number); d.qs[i].options.splice(j,1); return render(); }
  if(t.dataset.delq){ d.qs.splice(+t.dataset.delq,1); return render(); }
  if(id==='add-q'){ d.qs.push({type:'single',text:'',options:['','']}); return render(); }
  if(id==='to-questions'){ state.step=2; return render(); }
  if(id==='back-aud2'||id==='back-aud3'){ state.step=1; return render(); }
  if(id==='back-home2') return go('home');
  if(t.dataset.smartex){ state.smart.text=t.dataset.smartex; return render(); }
  if(id==='smart-go'){ state.smart.busy=true; render(); setTimeout(()=>{ const r=smartParse(state.smart.text); applySmart(d,r); state.smart.result=r; state.smart.busy=false; render(); },900); return; }
  if(id==='smart-scr'){ const r=state.smart.result.screener; d.screener={type:'yesno', text:r.text, keep:[0], screener:true}; toast('Screener added'); return render(); }
  if(id==='add-scr'){ d.screener={type:'yesno', text:'', keep:[0], screener:true}; return render(); }
  if(id==='scr-remove'){ d.screener=null; return render(); }
  if(id==='more-toggle'){ state.moreOpen=!state.moreOpen; return render(); }
  if(t.dataset.af){ const k=t.dataset.af, v=t.dataset.v, a=d.aud; if(Array.isArray(a[k])){ const ix=a[k].indexOf(v); ix>=0?a[k].splice(ix,1):a[k].push(v); } else a[k]=v; return render(); }
  if(t.dataset.age){ const a=d.aud.ages, x=t.dataset.age; const k=a.indexOf(x); k>=0?a.splice(k,1):a.push(x); a.sort((p,q)=>AGES.indexOf(p)-AGES.indexOf(q)); return render(); }
  if(t.dataset.gender){ d.aud.gender=t.dataset.gender; return render(); }
  if(id==='to-pay'){ if(!d.reward||d.reward<minReward(d.qs)) d.reward=minReward(d.qs)+settings.defaults.rewardBump; state.step=3; return render(); }
  if(id==='back-aud'){ state.step=2; return render(); }
  if(id==='n-dec'||id==='n-inc'){ d.n=Math.min(2000,Math.max(50,d.n+(id==='n-inc'?50:-50))); return render(); }
  if(id==='r-dec'||id==='r-inc'){ d.reward=Math.min(5,Math.max(minReward(d.qs),+(d.reward+(id==='r-inc'?0.25:-0.25)).toFixed(2))); return render(); }
  if(id==='launch') return runReview();
  if(t.dataset.qi){ state.qi=+t.dataset.qi; return render(); }
  if(id==='q-prev'){ state.qi--; return render(); }
  if(id==='q-next'){ state.qi++; return render(); }
  if(t.dataset.report){ state.reported[t.dataset.report]=true; toast('Reported. We’ll review it within 2 business days.'); return render(); }
  if(id==='export') return toast('CSV export is off in this prototype');
  if(id==='share'){ const url='https://reply.mapier.ai/r/'+state.resultsId; try{ navigator.clipboard.writeText(url).then(()=>toast('Link copied'),()=>toast(url)); }catch(_){ toast(url); } return; }
  if(id==='topup-open'){ state.topupOpen=true; state.payWith=wallet.methods.find(m=>m.main).id; return render(); }
  if(id==='topup-cancel'){ state.topupOpen=false; return render(); }
  if(t.dataset.amt){ state.topupAmt=+t.dataset.amt; return render(); }
  if(id==='topup-go'){ wallet.available+=state.topupAmt; txns.unshift({date:'Today', desc:'Top-up', survey:'—', amt:state.topupAmt, receipt:true}); state.topupOpen=false; toast(`Added ${fmt$(state.topupAmt)} to your balance from ${(wallet.methods.find(m=>m.id===state.payWith)||wallet.methods[0]).brand}`); return render(); }
  if(t.dataset.receipt) return toast('Receipts download as PDF in the live product');
  if(id==='card-edit') return toast('Card changes aren’t part of this prototype');
  if(t.dataset.paywith){ state.payWith=t.dataset.paywith; return render(); }
  if(t.dataset.pmMain){ wallet.methods.forEach(m=>{m.main=m.id===t.dataset.pmMain; if(m.main) m.backup=false;}); toast('Main payment method updated'); return render(); }
  if(t.dataset.pmBackup){ wallet.methods.forEach(m=>{ if(!m.main) m.backup=m.id===t.dataset.pmBackup; }); toast('Backup payment method updated'); return render(); }
  if(t.dataset.pmRemove){ const m=wallet.methods.find(x=>x.id===t.dataset.pmRemove); if(wallet.methods.length<=1) return toast('Add another payment method before removing this one');
    if(m.main){ const next=wallet.methods.find(x=>x.id!==m.id); next.main=true; next.backup=false; } wallet.methods=wallet.methods.filter(x=>x.id!==m.id); toast(`${m.brand} removed`); return render(); }
  if(id==='pm-add'){ if(!wallet.methods.some(m=>m.id==='a')) wallet.methods.push({id:'a',brand:'Amex',last4:'1005',exp:'02/29'}); toast('Card added. In the live product this opens Stripe’s secure card form.'); return render(); }
  if(t.dataset.pmWallet){ wallet.methods.push({id:t.dataset.pmWallet.replace(' ','').toLowerCase(), brand:t.dataset.pmWallet}); toast(`${t.dataset.pmWallet} added`); return render(); }
  if(t.dataset.jump){ const el=document.getElementById('set-'+t.dataset.jump); if(el) el.scrollIntoView({behavior: matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth', block:'start'}); return; }
  if(id==='s-email') return toast('Email changes need verification in the live product');
  if(id==='s-signout') return toast('Signed out of 2 other devices');
  if(id==='s-export') return toast('We’ll email a download link when your export is ready');
  if(id==='s-delete'){ state.confirmDelete=true; return render(); }
  if(id==='s-delete-cancel'){ state.confirmDelete=false; return render(); }
  if(id==='s-to-billing') return go('billing');
  if(id==='withdraw') return toast(`Withdrawal request for ${fmt$(wallet.available)} sent to support`);
});
document.addEventListener('keydown', e=>{ const tr=e.target.closest && e.target.closest('tr[data-id]'); if(tr && (e.key==='Enter'||e.key===' ')){ e.preventDefault(); tr.click(); } });
document.addEventListener('input', e=>{
  const t=e.target, d=state.draft;
  if(t.id==='survey-name'){ d.name=t.value; return; }
  if(t.id==='smart-text'){ state.smart.text=t.value; const b=$('#smart-go'); if(b) b.disabled=!t.value.trim()||state.smart.busy; return; }
  if(t.id==='scr-text'){ d.screener.text=t.value; const b=$('#to-questions'); if(b) b.disabled=!t.value.trim()||!d.screener.keep.length; return; }
  if(t.id==='imp-text'){ state.importText=t.value; const b=$('#imp-parse'); if(b) b.disabled=!t.value.trim(); return; }
  if(t.id==='ai-goal'){ state.aiGoal=t.value; const b=$('#ai-go'); if(b) b.disabled=!t.value.trim()||state.aiBusy; return; }
  if(t.dataset.qt!==undefined){ d.qs[+t.dataset.qt].text=t.value; refreshBuilderSide(); return; }
  if(t.dataset.o!==undefined){ d.qs[+t.dataset.q].options[+t.dataset.o]=t.value; refreshBuilderSide(); return; }
});
document.addEventListener('change', e=>{
  const t=e.target, d=state.draft;
  if(t.id==='imp-file' && t.files[0]){ const r=new FileReader(); r.onload=()=>{ state.parsed=parseCSV(String(r.result)); render(); }; r.readAsText(t.files[0]); return; }
  if(t.name==='aimode'){ state.aiMode=t.value; return; }
  if(t.dataset.type!==undefined){ const q=d.qs[+t.dataset.type]; q.type=t.value; if((q.type==='single'||q.type==='multi')&&!q.options) q.options=['','']; if(!(q.type==='single'||q.type==='multi')) delete q.options; return render(); }
  if(t.id==='region'){ d.aud.region=t.value; return render(); }
  if(t.id==='ex-past'){ d.aud.excludePast=t.checked; return render(); }
  if(t.dataset.scrkeep!==undefined){ const j=+t.dataset.scrkeep, k=d.screener.keep.indexOf(j); t.checked?(k<0&&d.screener.keep.push(j)):(k>=0&&d.screener.keep.splice(k,1)); return render(); }
  if(t.id==='at-on'){ wallet.autoTopup.on=t.checked; toast(t.checked?`Auto top-up on: add $${wallet.autoTopup.amt} below $${wallet.autoTopup.below}`:'Auto top-up off'); return render(); }
  if(t.id==='at-below'||t.id==='at-amt'){ wallet.autoTopup[t.id==='at-below'?'below':'amt']=+t.value; toast('Saved'); return render(); }
  if(t.dataset.set){ let v=t.type==='checkbox'?t.checked:t.value; if(t.tagName==='SELECT' && v!=='' && !isNaN(+v) && t.dataset.set!=='retention') v=+v; settings.set(t.dataset.set,v); toast('Saved'); return render(); }
  if(t.name==='signin'||t.name==='sender'){ settings[t.name]=t.value; toast('Saved'); return render(); }
  if(t.dataset.bd){ wallet.details[t.dataset.bd]=t.value; toast('Saved'); return; }
  if(t.id==='cap'){ d.capPct=+t.value; return render(); }
  if(t.dataset.keep!==undefined){ const j=+t.dataset.keep, k=d.aud.keep.indexOf(j); t.checked?(k<0&&d.aud.keep.push(j)):(k>=0&&d.aud.keep.splice(k,1)); return render(); }
  if(t.id==='n'){ d.n=Math.min(2000,Math.max(50,Math.round((+t.value||50)/50)*50)); return render(); }
  if(['Age','Gender','Region'].includes(t.id)){ const map={Age:'age',Gender:'gender',Region:'region'}; state.filter[map[t.id]]=t.value; return render(); }
});
function refreshBuilderSide(){
  const ph=document.querySelector('.phone'); if(ph) ph.innerHTML=phoneThread(state.draft);
  const p=problems(state.draft); const btn=$('#to-pay'); if(btn) btn.disabled=!!p.length;
  let w=document.querySelector('.builder .warn-text'); if(p.length){ if(!w&&btn){ w=document.createElement('div'); w.className='warn-text'; btn.parentElement.before(w);} if(w) w.textContent=p[0]; } else if(w) w.remove();
}
render();
})();
</script>
</body>
</html>
